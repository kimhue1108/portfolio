  // ---------- hover (port of style-hover) ----------
  function parseDecls(s){
    return s.split(';').map(function(x){return x.trim();}).filter(Boolean).map(function(d){
      var i = d.indexOf(':'); return [d.slice(0,i).trim(), d.slice(i+1).trim()];
    });
  }
  document.addEventListener('mouseover', function(e){
    var el = e.target.closest && e.target.closest('[data-hover]');
    if(!el || el._hov) return;
    el._hov = true; el._hovPrev = {};
    parseDecls(el.getAttribute('data-hover')).forEach(function(d){
      el._hovPrev[d[0]] = el.style.getPropertyValue(d[0]);
      el.style.setProperty(d[0], d[1]);
    });
  });
  document.addEventListener('mouseout', function(e){
    var el = e.target.closest && e.target.closest('[data-hover]');
    if(!el || !el._hov) return;
    if(e.relatedTarget && el.contains(e.relatedTarget)) return;
    for(var p in el._hovPrev){ el.style.setProperty(p, el._hovPrev[p]); }
    el._hov = false;
  });

  // ---------- motion: reveal / count / parallax (lifted from componentDidMount) ----------
  var revealIO = null, countIO = null;
  function initMotion(){
    var root = document.getElementById('main');
    if(!root) return;
    if(revealIO) revealIO.disconnect();
    if(countIO) countIO.disconnect();

    revealIO = new IntersectionObserver(function(entries){
      entries.forEach(function(en){
        if(en.isIntersecting){ en.target.style.opacity='1'; en.target.style.transform='none'; revealIO.unobserve(en.target); }
      });
    }, { threshold: 0.12 });
    root.querySelectorAll('[data-reveal]').forEach(function(el){
      el.style.opacity='0'; el.style.transform='translateY(30px)';
      el.style.transition='opacity .75s cubic-bezier(.2,.7,.2,1), transform .75s cubic-bezier(.2,.7,.2,1)';
      el.style.transitionDelay=(el.dataset.delay||0)+'ms';
    });
    requestAnimationFrame(function(){
      root.querySelectorAll('[data-reveal]').forEach(function(el){
        var r = el.getBoundingClientRect();
        if(r.top < window.innerHeight*0.95){ el.style.opacity='1'; el.style.transform='none'; }
        else revealIO.observe(el);
      });
    });

    countIO = new IntersectionObserver(function(entries){
      entries.forEach(function(en){
        if(!en.isIntersecting) return;
        var el = en.target, target = parseFloat(el.dataset.count)||0, dur=1500, t0=performance.now();
        var tick = function(t){ var p=Math.min(1,(t-t0)/dur); el.textContent=Math.floor(target*(1-Math.pow(1-p,3))); if(p<1) requestAnimationFrame(tick); else el.textContent=target; };
        requestAnimationFrame(tick); countIO.unobserve(el);
      });
    }, { threshold: 0.6 });
    root.querySelectorAll('[data-count]').forEach(function(el){ countIO.observe(el); });
  }

  // single persistent parallax scroll handler (queries current DOM)
  window.addEventListener('scroll', function(){
    var y = window.scrollY;
    var els = document.querySelectorAll('#main [data-parallax]');
    for(var i=0;i<els.length;i++){ els[i].style.transform = 'translateY('+(y*parseFloat(els[i].dataset.parallax))+'px)'; }
  }, { passive:true });

  // ---------- Lumi (lifted, init once) ----------
  var lumiClose = function(){};
  function initLumi(){
    var wrap = document.getElementById('ss-lumi-wrap');
    var lumi = document.getElementById('ss-lumi');
    var menu = document.getElementById('ss-lumi-menu');
    if(!wrap || !lumi) return;
    var body = document.getElementById('ss-lumi-body');
    var mouth = document.getElementById('ss-lumi-mouth');
    var hint = document.getElementById('ss-lumi-hint');
    var pupils = lumi.querySelectorAll('.ss-pupil');
    var menuOpen = false;
    var anchor = function(){ var z=window.__zoom||1; return { x: window.innerWidth/z - 78, y: window.innerHeight/z - 92 }; };
    var t=0, scrollVel=0, bob=0, lastY=0, curX=0, curY=0;
    var mouseX = window.innerWidth/(window.__zoom||1), mouseY = window.innerHeight/(window.__zoom||1);

    lumiClose = function(){ setTimeout(function(){ setMenu(false); }, 60); };
    function setMenu(open){
      menuOpen = open;
      if(!menu) return;
      menu.style.opacity = open?'1':'0';
      menu.style.visibility = open?'visible':'hidden';
      menu.style.pointerEvents = open?'auto':'none';
      menu.style.transform = open?'translate(-50%,0) scale(1)':'translate(-50%,12px) scale(.9)';
      if(hint) hint.style.opacity = open?'0':'.92';
    }
    function loop(){
      var a = anchor(), x, y;
      if(menuOpen){ x=a.x; y=a.y; wrap.style.transform='translate('+x+'px,'+y+'px)'; }
      else {
        t += 0.018; scrollVel *= 0.9; bob += (scrollVel-bob)*0.12;
        var R=26; x=a.x+Math.cos(t)*R; y=a.y+Math.sin(t*1.7)*(R*0.62)-bob*0.5;
        wrap.style.transform='translate('+x+'px,'+y+'px)';
      }
      curX=x; curY=y;
      var dx=mouseX-x, dy=mouseY-y, dist=Math.hypot(dx,dy), ang=Math.atan2(dy,dx);
      var mp=Math.min(2.6, dist/70);
      pupils.forEach(function(p){ p.style.transform='translate('+(Math.cos(ang)*mp)+'px,'+(Math.sin(ang)*mp)+'px)'; });
      var near = dist<200 || menuOpen;
      if(body) body.style.transform = near?'scale(1.1)':'scale(1)';
      if(mouth){ mouth.style.width=near?'17px':'13px'; mouth.style.height=near?'9px':'7px'; }
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
    window.addEventListener('mousemove', function(e){ var z=window.__zoom||1; mouseX=e.clientX/z; mouseY=e.clientY/z; }, { passive:true });
    setTimeout(function(){ if(hint && !menuOpen) hint.style.opacity='0'; }, 4500);

    function burst(ox,oy){
      var chars=['✦','✧','❀','♡','✿','★'], cols=['#FF8E72','#C7B5E8','#9FC9AE','#FCE3A0','#FFB8A0'];
      for(var i=0;i<12;i++){
        var s=document.createElement('span');
        s.textContent=chars[i%chars.length];
        var ang=(Math.PI*2*i)/12 + Math.random()*0.5, dist=55+Math.random()*48;
        s.style.cssText='position:fixed;left:'+ox+'px;top:'+oy+'px;z-index:200;pointer-events:none;font-size:'+(12+Math.random()*12)+'px;color:'+cols[i%cols.length]+';transform:translate(-50%,-50%);transition:transform .85s cubic-bezier(.15,.7,.3,1),opacity .85s ease;';
        document.body.appendChild(s);
        (function(s,ang,dist){ requestAnimationFrame(function(){ s.style.transform='translate(calc(-50% + '+(Math.cos(ang)*dist)+'px),calc(-50% + '+(Math.sin(ang)*dist)+'px)) rotate('+(Math.random()*360)+'deg) scale(.4)'; s.style.opacity='0'; }); })(s,ang,dist);
        setTimeout((function(s){ return function(){ s.remove(); }; })(s), 900);
      }
    }
    lumi.addEventListener('click', function(e){
      e.stopPropagation();
      burst(curX, curY);
      if(body){ body.style.transform='scale(1.3)'; setTimeout(function(){ body.style.transform='scale(1)'; },200); }
      setMenu(!menuOpen);
    });
    document.addEventListener('click', function(ev){ if(menuOpen && !wrap.contains(ev.target)) setMenu(false); });
    window.addEventListener('scroll', function(){
      var y=window.scrollY; scrollVel += (y-lastY); scrollVel=Math.max(-60,Math.min(60,scrollVel)); lastY=y;
      if(menuOpen) setMenu(false);
    }, { passive:true });
  }

  // ---------- zoom-to-fit: treat the page as a ~1280px artboard and scale it up to fill wider screens ----------
  function applyZoom(){
    var dw = 1440;
    var z = window.innerWidth > dw ? window.innerWidth / dw : 1;
    window.__zoom = z;
    document.documentElement.style.zoom = z === 1 ? '' : String(z);
    // 100vh renders as 100vh*zoom under CSS zoom; expose a zoom-compensated viewport height
    document.documentElement.style.setProperty('--app-vh', (window.innerHeight / z) + 'px');
  }
